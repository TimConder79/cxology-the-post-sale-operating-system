<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Redirecting…</title>
  <script>
    // Redirect legacy chapter.html?ch=N links to chapter-N.html
    const ch = new URLSearchParams(window.location.search).get('ch');
    if (ch && parseInt(ch) >= 1 && parseInt(ch) <= 22) {
      window.location.replace('chapter-' + ch + '.html');
    } else {
      window.location.replace('index.html');
    }
  </script>
</head>
<body>
  <p>Redirecting… <a href="index.html">Click here if not redirected.</a></p>
</body>
</html>
