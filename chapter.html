<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'"/>
  <meta charset="UTF-8"/>
  <title>Redirecting…</title>
  <script>
    // Redirect legacy chapter.html?ch=N links to chapter-N.html
    const ch = new URLSearchParams(window.location.search).get('ch');
    if (ch && parseInt(ch) >= 1 && parseInt(ch) <= 22) {
      window.location.replace('chapter-' + ch + '.html');
    } else {
      window.location.replace('index.html');
    }
  </script>
</head>
<body>
  <p>Redirecting… <a href="index.html">Click here if not redirected.</a></p>

<footer style="text-align:center;padding:1.5rem 1rem;font-size:0.8rem;color:var(--text-muted);background:transparent;">

</footer>

</body>
</html>
