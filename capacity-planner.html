/* ── MODEL ── */
function run(p){
  const gH=p.gH.map(v=>Math.round(v*p.gM)),gL=p.gL.map(v=>Math.round(v*p.gM));
  const effortMix=p.effortMix||{oH:1,oL:1,c1H:1,c1L:1,c2H:1,c2L:1};
  const oD=Array(12).fill(0),cD=Array(12).fill(0);
  for(let s=0;s<12;s++)for(let j=0;j<12;j++){
    const c=s+j;if(c>=12)break;
    oD[c]+=(gH[s]*(p.oH[j]*effortMix.oH)+gL[s]*(p.oL[j]*effortMix.oL));
    cD[c]+=(gH[s]*(p.c1H[j]*effortMix.c1H)+gL[s]*(p.c1L[j]*effortMix.c1L));
  }
  for(let c=0;c<12;c++)cD[c]+=(p.eH*(p.c2H[c]*effortMix.c2H)+p.eL*(p.c2L[c]*effortMix.c2L));
  const tD=oD.map((v,i)=>v+cD[i]),oS=Array(12).fill(0),cS=Array(12).fill(0);
  p.tm.forEach(m=>{
    for(let mo=0;mo<12;mo++){
      const j=mo-m.s;if(j<0)continue;
      let r=1;if(j<p.rp.length)r=p.rp[j]/100;
      const h=p.wh[mo]*(p.ta/100)*r;
      if(m.r==="Onboarding")oS[mo]+=h;else cS[mo]+=h;
    }
  });
  const tS=oS.map((v,i)=>v+cS[i]),oES=oS.map(v=>v*(p.pp/100)),cES=cS.map(v=>v*(p.pp/100)),eS=tS.map(v=>v*(p.pp/100)),rH=tS.map(v=>v*(p.rr/100));
  const ut=tD.map((d,i)=>eS[i]>0?d/eS[i]:0),hd=eS.map((s,i)=>s-tD[i]);
  const rs=ut.map(u=>u>=1?"red":u>=.9?"orange":"green");
  const fr=rs.indexOf("red"),pk=Math.max(...ut),pm=ut.indexOf(pk);
  const ts=p.tm.filter(m=>m.s<12).length,gap=sum(tD)-sum(eS);
  const ac=sum(p.wh)*(p.ta/100)*(p.pp/100),hn=gap>0?Math.ceil(gap/ac):0;
  const oSh=sum(oD.map((d,i)=>Math.max(0,d-oES[i])));
  const cSh=sum(cD.map((d,i)=>Math.max(0,d-cES[i])));
  const rT=sum(rH);let pc="growth volume";
  if(oSh>cSh&&oSh>rT)pc="onboarding load";else if(cSh>oSh&&cSh>rT)pc="ongoing CSM load";else if(rT>oSh&&rT>cSh)pc="reactive drag";
  const fl=p.sa*(1+p.oh/100+p.tb/100);
  return{oD,cD,tD,oS,cS,oES,cES,eS,rH,ut,hd,rs,fr,rc:rs.filter(r=>r==="red").length,oc:rs.filter(r=>r==="orange").length,gc:rs.filter(r=>r==="green").length,pk,pm,ts,hn,hm:fr>=0?Math.max(0,fr-3):-1,pc,oSh,cSh,rT,fl,tc:ts*fl,ah:hn*fl,sr:(p.eH+sum(gH))*p.hA+(p.eL+sum(gL))*p.lA,ro:gap*.8<=0,gap};
}

/* ── SVG CHARTS ── */
function BarChart({data,bars,height=200,yMax:ymProp}){
  const W=Math.max(600,data.length*60);const H=height;const pad={t:20,r:20,b:30,l:50};
  const cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  const ym=ymProp||Math.max(...data.flatMap(d=>bars.map(b=>d[b.key]||0)))*1.15||100;
  const bw=cw/data.length;const barW=bw*0.6/bars.length;
  const [tip,setTip]=useState(null);
  const yTicks=Array.from({length:5},(_,i)=>Math.round(ym*i/4));
  return<div style={{position:"relative",overflowX:"auto"}}>
    {tip&&<div className="chart-tip" style={{left:tip.x,top:tip.y}}>{tip.text}</div>}
    <svg width={W} height={H} style={{display:"block"}}>
      {yTicks.map(v=><g key={v}><line x1={pad.l} x2={W-pad.r} y1={pad.t+ch*(1-v/ym)} y2={pad.t+ch*(1-v/ym)} stroke={C.g2} strokeDasharray="3 3"/><text x={pad.l-6} y={pad.t+ch*(1-v/ym)+4} textAnchor="end" fontSize={10} fill={C.g5}>{v}</text></g>)}
      {data.map((d,i)=>{const x=pad.l+i*bw;return<g key={i}>
        <text x={x+bw/2} y={H-8} textAnchor="middle" fontSize={10} fill={C.g5}>{d.label}</text>
        {bars.map((b,bi)=>{const val=d[b.key]||0;const bh=ch*val/ym;const bx=x+(bw-barW*bars.length)/2+bi*barW;
          const fill=typeof b.fill==="function"?b.fill(d):b.fill;
          return<rect key={bi} x={bx} y={pad.t+ch-bh} width={barW-1} height={Math.max(0,bh)} rx={2} fill={fill}
            onMouseEnter={e=>setTip({x:e.clientX,y:bx+barW/2,text:b.name+": "+Math.round(val)})}
            onMouseLeave={()=>setTip(null)} style={{cursor:"pointer"}}/>;
        })}
      </g>;})}
    </svg>
  </div>;
}

function LineChart({data,lines,height=260,refLines=[]}){
  const W=Math.max(600,data.length*60);const H=height;const pad={t:20,r:20,b:30,l:50};
  const cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  const allVals=data.flatMap(d=>lines.map(l=>d[l.key]||0));
  const ym=Math.max(...allVals)*1.15||100;
  const yTicks=Array.from({length:5},(_,i)=>Math.round(ym*i/4));
  const [tip,setTip]=useState(null);
  const px=(i)=>pad.l+i*(cw/(data.length-1||1));
  const py=(v)=>pad.t+ch*(1-v/ym);
  return<div style={{position:"relative",overflowX:"auto"}}>
    {tip&&<div className="chart-tip" style={{left:tip.x,top:tip.y}}>{tip.text}</div>}
    <svg width={W} height={H} style={{display:"block"}}>
      {yTicks.map(v=><g key={v}><line x1={pad.l} x2={W-pad.r} y1={py(v)} y2={py(v)} stroke={C.g2} strokeDasharray="3 3"/><text x={pad.l-6} y={py(v)+4} textAnchor="end" fontSize={10} fill={C.g5}>{v}</text></g>)}
      {refLines.map((rl,i)=><line key={i} x1={pad.l} x2={W-pad.r} y1={py(rl.y)} y2={py(rl.y)} stroke={rl.color} strokeDasharray="4 4" strokeWidth={1}/>)}
      {data.map((d,i)=><text key={i} x={px(i)} y={H-8} textAnchor="middle" fontSize={10} fill={C.g5}>{d.label}</text>)}
      {lines.map((l,li)=>{
        const pts=data.map((d,i)=>`${px(i)},${py(d[l.key]||0)}`).join(" ");
        return<g key={li}>
          {l.area&&<polygon points={`${px(0)},${py(0)} ${pts} ${px(data.length-1)},${py(0)}`} fill={l.area} opacity={0.3}/>}
          <polyline points={pts} fill="none" stroke={l.color} strokeWidth={l.width||2}/>
          {data.map((d,i)=><circle key={i} cx={px(i)} cy={py(d[l.key]||0)} r={3} fill={l.color}
            onMouseEnter={e=>setTip({x:e.clientX,y:py(d[l.key])-10,text:l.name+": "+Math.round(d[l.key])})}
            onMouseLeave={()=>setTip(null)} style={{cursor:"pointer"}}/>)}
        </g>;
      })}
    </svg>
    <div style={{display:"flex",gap:16,justifyContent:"center",marginTop:8}}>
      {lines.map((l,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:4,fontSize:11,color:C.g7}}>
        <div style={{width:12,height:3,background:l.color,borderRadius:2}}/>{l.name}
      </div>)}
    </div>
  </div>;
}

function StackedBarChart({data,bars,height=200}){
  const W=Math.max(600,data.length*60);const H=height;const pad={t:20,r:20,b:30,l:50};
  const cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  const ym=Math.max(...data.map(d=>bars.reduce((s,b)=>s+(d[b.key]||0),0)))*1.15||100;
  const bw=cw/data.length;const barW=bw*0.6;
  const yTicks=Array.from({length:5},(_,i)=>Math.round(ym*i/4));
  return<div style={{overflowX:"auto"}}>
    <svg width={W} height={H} style={{display:"block"}}>
      {yTicks.map(v=><g key={v}><line x1={pad.l} x2={W-pad.r} y1={pad.t+ch*(1-v/ym)} y2={pad.t+ch*(1-v/ym)} stroke={C.g2} strokeDasharray="3 3"/><text x={pad.l-6} y={pad.t+ch*(1-v/ym)+4} textAnchor="end" fontSize={10} fill={C.g5}>{v}</text></g>)}
      {data.map((d,i)=>{const x=pad.l+i*bw;let cum=0;return<g key={i}>
        <text x={x+bw/2} y={H-8} textAnchor="middle" fontSize={10} fill={C.g5}>{d.label}</text>
        {bars.map((b,bi)=>{const val=d[b.key]||0;const bh=ch*val/ym;const by=pad.t+ch-ch*cum/ym-bh;cum+=val;
          return<rect key={bi} x={x+(bw-barW)/2} y={by} width={barW} height={Math.max(0,bh)} fill={b.fill} rx={bi===bars.length-1?2:0}/>;
        })}
      </g>;})}
    </svg>
    <div style={{display:"flex",gap:16,justifyContent:"center",marginTop:8}}>
      {bars.map((b,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:4,fontSize:11,color:C.g7}}>
        <div style={{width:10,height:10,background:b.fill,borderRadius:2}}/>{b.name}
      </div>)}
    </div>
  </div>;
}

            <div id="forecast-growth" ref={el=>plannerStepRefs.current["forecast-growth"]=el} style={{...sCd,border:openStep==="forecast-growth"?"2px solid "+C.nv:"1px solid "+C.g2,boxShadow:openStep==="forecast-growth"?"0 10px 28px rgba(26,46,66,.10)":"none",scrollMarginTop:90,transition:"all .2s ease"}}>
        <StepHeader step="1" title="Forecast Growth" desc="Model planned growth by month. This is where future demand begins." open={openStep==="forecast-growth"} onToggle={()=>setOpenStep(openStep==="forecast-growth"?null:"forecast-growth")} color={C.nv} />
        {openStep==="forecast-growth"&&<div style={{marginTop:16}}><div style={{fontSize:13,color:C.g7,lineHeight:1.65,marginBottom:14}}>Future demand starts here. Growth does not just increase customer count; it creates a rolling wave of onboarding and ongoing service work that compounds across the year. Even a directional forecast is more useful than pretending growth will spread itself evenly.</div>
        <NG label="High Touch — New / Month" values={gH} onChange={sgH} accent={C.nv}/>
        <div style={{fontSize:12,color:C.tm,marginTop:-10,marginBottom:14,paddingLeft:9,borderLeft:"2px solid "+C.g2}}>Use directional numbers if you do not have a perfect sales forecast yet. A reasonable estimate is more helpful than leaving growth blank.</div>
        <NG label="Low Touch — New / Month" values={gL} onChange={sgL} accent={C.bl}/>
        <div style={{fontSize:12,color:C.tm,marginTop:-10,paddingLeft:9,borderLeft:"2px solid "+C.g2}}>Think in logo adds by month, not annual totals. The timing of growth matters because it creates waves of onboarding demand later.</div>
        </div>}
      </div>

            <div id="current-customers" ref={el=>plannerStepRefs.current["current-customers"]=el} style={{...sCd,border:openStep==="current-customers"?"2px solid "+C.bl:"1px solid "+C.g2,boxShadow:openStep==="current-customers"?"0 10px 28px rgba(26,46,66,.10)":"none",scrollMarginTop:90,transition:"all .2s ease"}}>
        <StepHeader step="2" title="Add Current Customers" desc="Bring in the customer base that already consumes capacity today." open={openStep==="current-customers"} onToggle={()=>setOpenStep(openStep==="current-customers"?null:"current-customers")} color={C.bl} />
        {openStep==="current-customers"&&<div style={{marginTop:16}}><div style={{fontSize:13,color:C.g7,lineHeight:1.65,marginBottom:14}}>Current customers are easy to overlook because they are already in motion, but they are often where most of the real demand lives. Bringing them into the model keeps the plan grounded in the work the team is already carrying before a single new logo is added.</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}><div><label style={sL}>Existing HT</label><input type="number" value={eH} onChange={e=>seH(+e.target.value||0)} style={sI}/><div style={{fontSize:12,color:C.tm,marginTop:6}}>Customers already in motion still consume real capacity. Count the customers the team is truly supporting today.</div></div><div><label style={sL}>Existing LT</label><input type="number" value={eL} onChange={e=>seL(+e.target.value||0)} style={sI}/><div style={{fontSize:12,color:C.tm,marginTop:6}}>This becomes the baseline load the team carries before future growth is layered on top.</div></div></div>
        <Ac title="How cohorts cascade"><p style={{fontSize:12,color:C.tm,lineHeight:1.6}}>Each month's new customers cascade demand forward through journey months. Onboarding concentrates in early lifecycle months. Existing customers use the year-two-and-beyond pattern.</p></Ac>
        {guidedMode&&<GuideBox title="Use original start dates" tone="neutral">Use the original contractual start date whenever possible. That is what lets the planner determine where a customer sits in the lifecycle and whether they should follow year-one effort or the steadier year-two-and-beyond pattern. If you use the wrong date, the model may look precise while quietly misclassifying demand.</GuideBox>}
        </div>}
      </div>

            <div id="designed-effort" ref={el=>plannerStepRefs.current["designed-effort"]=el} style={{...sCd,border:openStep==="designed-effort"?"2px solid "+C.pu:"1px solid "+C.g2,boxShadow:openStep==="designed-effort"?"0 10px 28px rgba(26,46,66,.10)":"none",scrollMarginTop:90,transition:"all .2s ease"}}>
        <StepHeader step="3" title="Define Designed Effort" desc="Translate service moments into effort across the lifecycle. Effort should include prep, execution, and follow-through." open={openStep==="designed-effort"} onToggle={()=>setOpenStep(openStep==="designed-effort"?null:"designed-effort")} color={C.pu} />
        {openStep==="designed-effort"&&<div style={{marginTop:16}}><div style={{fontSize:13,color:C.g7,lineHeight:1.65,marginBottom:14}}>Designed effort is the heart of the model because it turns a service philosophy into actual work. The point is not to measure every minute with perfect precision. It is to define the repeatable effort required to deliver the experience you want customers to have, then see whether the team you have can sustain it.</div>
        {guidedMode&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(240px,1fr))",gap:12,marginBottom:12}}>
          <GuideBox title="Start with current activities" tone="neutral">Most teams make this harder than it needs to be by trying to design the perfect future state too early. Start with the work the team actually performs today: every kickoff, follow-up, alignment meeting, insight email, escalation, and internal task that supports the customer. Once reality is visible, you can decide what should stay, what should change, and what should disappear.</GuideBox>
          <GuideBox title="Ignore outliers" tone="warning">Estimate for the experience you are trying to deliver consistently, not for the handful of customers who consume an unusual amount of time. Outliers make the model feel safer in the moment, but they usually inflate effort, weaken the story, and make the resulting plan harder to defend. Build the baseline around the norm, then manage the exceptions as exceptions.</GuideBox>
        </div>}
        <div style={{marginBottom:14,padding:"12px 14px",borderRadius:10,background:C.wh,border:"1px solid "+C.g2,fontSize:13,color:C.g7,lineHeight:1.65}}>This is the point where the model becomes tangible. Instead of talking about work in general terms, assign time to the parts of the experience that customers actually move through month by month. Start with what feels reasonable and refine later.</div>

        {/* Onboarding panel */}
        <div style={{marginBottom:16,borderRadius:10,border:"1px solid "+C.pu+"55",overflow:"hidden"}}>
          <div style={{background:"linear-gradient(135deg,"+C.pu+"18,"+C.pu+"0a)",borderBottom:"1px solid "+C.pu+"30",padding:"12px 16px",display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:8,height:8,borderRadius:"50%",background:C.pu,flexShrink:0}}/>
            <div>
              <div style={{fontSize:13,fontWeight:700,color:C.pu}}>Onboarding Effort</div>
              <div style={{fontSize:11,color:C.tm,marginTop:1}}>Hours per customer · M1–M12 of lifecycle</div>
            </div>
          </div>
          <div style={{padding:"16px 16px 8px"}}>
            <NG label="High Touch — Year 1" values={oH} onChange={soH} cols={JC} accent={C.pu}/>
            <div style={{fontSize:12,color:C.tm,marginTop:-10,marginBottom:14,paddingLeft:9,borderLeft:"2px solid "+C.g2}}>Heavier-touch onboarding usually carries more preparation and follow-through. If unsure, begin with the conversations that feel hardest to deliver consistently.</div>
            <NG label="Low Touch — Year 1" values={oL} onChange={soL} cols={JC} accent={C.pu}/>
            <div style={{fontSize:12,color:C.tm,marginTop:-10,marginBottom:8,paddingLeft:9,borderLeft:"2px solid "+C.g2}}>Lower-touch does not mean no effort. Keep the moments that matter, then remove or automate what does not truly help the customer progress.</div>
          </div>
        </div>

        {guidedMode&&<GuideBox title="Place work where customers feel it" tone="success">The timing of effort should follow the customer journey, not the structure of your org chart. Early months are often heavier because they carry kickoff, onboarding decisions, and the push to first value. As customers mature, the work should shift toward alignment, insight delivery, goal attainment, and renewal or growth preparation. When effort is placed where the customer actually feels it, the model becomes easier to explain and easier to believe.</GuideBox>}

        {/* CSM panel */}
        <div style={{marginTop:16,borderRadius:10,border:"1px solid "+C.bl+"55",overflow:"hidden"}}>
          <div style={{background:"linear-gradient(135deg,"+C.bl+"18,"+C.bl+"0a)",borderBottom:"1px solid "+C.bl+"30",padding:"12px 16px",display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:8,height:8,borderRadius:"50%",background:C.bl,flexShrink:0}}/>
            <div>
              <div style={{fontSize:13,fontWeight:700,color:C.bl}}>CSM Effort</div>
              <div style={{fontSize:11,color:C.tm,marginTop:1}}>Hours per customer · M1–M12 of lifecycle</div>
            </div>
          </div>
          <div style={{padding:"16px 16px 8px"}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:4}}>
              <div>
                <NG label="High Touch — Year 1" values={c1H} onChange={sc1H} cols={JC} accent={C.bl}/>
                <NG label="High Touch — Year 2+" values={c2H} onChange={sc2H} cols={JC} accent={C.bl}/>
              </div>
              <div>
                <NG label="Low Touch — Year 1" values={c1L} onChange={sc1L} cols={JC} accent={C.bl}/>
                <NG label="Low Touch — Year 2+" values={c2L} onChange={sc2L} cols={JC} accent={C.bl}/>
              </div>
            </div>
            <div style={{fontSize:12,color:C.tm,marginBottom:12,paddingLeft:9,borderLeft:"2px solid "+C.g2}}>Year two and beyond should usually be lighter than year one because kickoff and onboarding are gone, but it should still reflect alignment, insight sharing, and renewal preparation.</div>
          </div>
        </div>
        </div>}
      </div>

            <div id="team-capacity" ref={el=>plannerStepRefs.current["team-capacity"]=el} style={{...sCd,border:openStep==="team-capacity"?"2px solid "+C.ol:"1px solid "+C.g2,boxShadow:openStep==="team-capacity"?"0 10px 28px rgba(26,46,66,.10)":"none",scrollMarginTop:90,transition:"all .2s ease"}}>
        <StepHeader step="4" title="Model Team Capacity" desc="Layer in current resources, future hires, and onboarding ramp to see when capacity actually arrives." open={openStep==="team-capacity"} onToggle={()=>setOpenStep(openStep==="team-capacity"?null:"team-capacity")} color={C.ol} />
        {openStep==="team-capacity"&&<div style={{marginTop:16}}><div style={{fontSize:13,color:C.g7,lineHeight:1.65,marginBottom:14}}>This step converts a hiring conversation into a timing conversation. The question is not only how many people you need, but when they need to start, how quickly they will ramp, and whether the current team can carry the load until then without slipping into unsustainable effort.</div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}><h4 style={{fontSize:14,fontWeight:600,color:C.nv}}>Team</h4><button onClick={()=>sTm([...tm,{n:"New "+(tm.length+1),r:"CSM",s:6}])} style={{...sB,background:C.ol,color:C.nd,padding:"6px 14px",fontSize:12}}>+ Add</button></div>
        <div style={{borderRadius:8,border:"1px solid "+C.g2,overflow:"hidden",marginBottom:10}}>

            {["Name","Role","Start Mo",""].map((h,i)=><div key={i} style={{fontSize:10,fontWeight:600,color:C.tm,letterSpacing:".06em",textTransform:"uppercase"}}>{h}</div>)}
          </div>
          {tm.map((m,i)=>{
            const isOB=m.r==="Onboarding";

            return<div key={i} style={{display:"grid",gridTemplateColumns:"2fr 1.2fr 80px 36px",gap:0,padding:"8px 12px 8px 14px",borderBottom:i<tm.length-1?"1px solid "+C.g1:"none",alignItems:"center",background:isFuture?"rgba(197,212,78,.03)":C.wh,transition:"background .15s"}}>
              <input value={m.n} onChange={e=>{const t=[...tm];t[i]={...t[i],n:e.target.value};sTm(t);}}
                style={{...sI,fontSize:13,padding:"6px 10px",borderColor:"transparent",background:"transparent",boxShadow:"none"}}
                onFocus={e=>e.target.style.borderColor=C.g2}
                onBlur={e=>e.target.style.borderColor="transparent"}
              />
              <div style={{paddingRight:8}}>
                <select value={m.r} onChange={e=>{const t=[...tm];t[i]={...t[i],r:e.target.value};sTm(t);}}
                  style={{...sI,padding:"5px 8px",fontSize:12,background:isOB?C.pu+"18":C.bl+"12",borderColor:isOB?C.pu+"55":C.bl+"44",color:isOB?C.pu:C.bl,fontWeight:600,cursor:"pointer"}}>
                  <option>CSM</option><option>Onboarding</option>
                </select>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:4}}>
                <input type="number" value={m.s} onChange={e=>{const t=[...tm];t[i]={...t[i],s:+e.target.value};sTm(t);}}
                  style={{...sIs,width:54,borderColor:isFuture?C.ol+"88":C.g2,background:isFuture?"rgba(197,212,78,.08)":C.wh,fontWeight:isFuture?600:400}}
                />
              </div>
              <button onClick={()=>sTm(tm.filter((_,j)=>j!==i))} style={{fontSize:14,color:C.g5,background:"none",border:"none",cursor:"pointer",padding:"4px",borderRadius:4,display:"flex",alignItems:"center",justifyContent:"center",transition:"color .15s"}} onMouseEnter={e=>e.target.style.color=C.co} onMouseLeave={e=>e.target.style.color=C.g5}>✕</button>
            </div>;
          })}
        </div>
        <div style={{display:"flex",gap:12,fontSize:11,color:C.tm,marginBottom:8,flexWrap:"wrap",alignItems:"center"}}>
          <span style={{display:"flex",alignItems:"center",gap:4}}><span style={{display:"inline-block",width:8,height:8,borderRadius:2,background:C.bl+"66"}}/>CSM</span>
          <span style={{display:"flex",alignItems:"center",gap:4}}><span style={{display:"inline-block",width:8,height:8,borderRadius:2,background:C.pu+"66"}}/>Onboarding</span>
          <span style={{display:"flex",alignItems:"center",gap:4}}><span style={{display:"inline-block",width:8,height:8,borderRadius:2,background:C.ol+"88"}}/>Future hire</span>
          <span style={{color:C.g2}}>·</span>
          <span>Start month: 0 = Jan, −12 = tenured, 6 = future hire in July</span>
        </div>
        <div style={{fontSize:12,color:C.tm,marginTop:8}}>Model the team you have, then add the team you think you will need. This helps you see the difference between current capacity and planned capacity instead of blending them together.</div>
        {guidedMode&&<GuideBox title="Hiring is not instant capacity" tone="warning">A hire request does not create immediate capacity. Recruiting, interviews, offers, notice periods, onboarding, and coaching all happen before a new person can contribute at full strength. The value of the model is that it gives you time to act early, rather than waiting until the team is already overloaded and the new hire walks into chaos.</GuideBox>}
        <h4 style={{fontSize:14,fontWeight:600,color:C.nv,marginTop:20,marginBottom:8}}>Hire Ramp</h4>
        <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>{rp.map((v,i)=><div key={i}><label style={sL}>Mo {i+1}</label><input type="number" value={v} onChange={e=>{const r=[...rp];r[i]=+e.target.value||0;sRp(r);}} style={sIs}/><span style={{fontSize:11,color:C.tm}}> %</span></div>)}</div>
        <div style={{fontSize:12,color:C.tm,marginTop:8}}>Use conservative ramp assumptions at first. It is better to be slightly cautious about new-hire productivity than to assume instant relief and miss your hiring window.</div>
        </div>}

      <div id="reactive-proactive" ref={el=>plannerStepRefs.current["reactive-proactive"]=el} style={{...sCd,border:openStep==="reactive-proactive"?"2px solid "+C.co:"1px solid "+C.g2,boxShadow:openStep==="reactive-proactive"?"0 10px 28px rgba(26,46,66,.10)":"none",scrollMarginTop:90,transition:"all .2s ease"}}>
        <StepHeader step="5" title="Adjust Reactive vs Proactive Work" desc="Reactive work crowds out designed customer work. Balance the mix and set the availability assumptions that power the model." open={openStep==="reactive-proactive"} onToggle={()=>setOpenStep(openStep==="reactive-proactive"?null:"reactive-proactive")} color={C.co} />
        {openStep==="reactive-proactive"&&<div style={{marginTop:16}}><div style={{fontSize:13,color:C.g7,lineHeight:1.65,marginBottom:14}}>Reactive work is where many capacity plans quietly fail. If too much of the team's time is being consumed by interruptions, escalations, and ad hoc support, the designed work never actually happens, which means the customer experience and the plan drift apart.</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}>
          <div>
            <label style={sL}>Target Availability %</label>
            <div style={{position:"relative"}}>
              <input type="number" value={ta} onChange={e=>sTa(+e.target.value||0)} style={{...sI,paddingRight:32}}/>
              <span style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",fontSize:13,color:C.tm,pointerEvents:"none"}}>%</span>
            </div>
            <div style={{fontSize:11,color:C.tm,marginTop:5}}>Customer-facing time as % of total hours</div>
          </div>
          <div>
            <label style={sL}>Designed Proactive %</label>
            <div style={{position:"relative"}}>
              <input type="number" value={pp} onChange={e=>{const v=Math.max(0,Math.min(100,+e.target.value||0));sPp(v);sRr(100-v);}} style={{...sI,paddingRight:32,borderColor:C.tl+"66"}}/>
              <span style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",fontSize:13,color:C.tl,pointerEvents:"none"}}>%</span>
            </div>
            <div style={{fontSize:11,color:C.tl,marginTop:5,fontWeight:500}}>Planned service moments</div>
          </div>
          <div>
            <label style={sL}>Reactive Work %</label>
            <div style={{position:"relative"}}>
              <input type="number" value={rr} onChange={e=>{const v=Math.max(0,Math.min(100,+e.target.value||0));sRr(v);sPp(100-v);}} style={{...sI,paddingRight:32,borderColor:rr>30?C.co+"88":C.g2}}/>
              <span style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",fontSize:13,color:rr>30?C.co:C.tm,pointerEvents:"none"}}>%</span>
            </div>
            <div style={{fontSize:11,color:rr>30?C.co:C.tm,marginTop:5,fontWeight:rr>30?600:400}}>{rr>30?"High reactive drag — worth reducing":"Interruptions, escalations, unplanned asks"}</div>
          </div>
        </div>
        {/* Live mix bar */}
        <div style={{marginTop:14,borderRadius:8,overflow:"hidden",height:8,background:C.g2,display:"flex"}}>
          <div style={{width:pp+"%",background:C.tl,transition:"width .3s ease"}}/>
          <div style={{width:rr+"%",background:rr>30?C.co:C.am,transition:"width .3s ease"}}/>
        </div>
        <div style={{display:"flex",gap:16,marginTop:6,fontSize:11,color:C.tm,flexWrap:"wrap"}}>
          <span style={{display:"flex",alignItems:"center",gap:4}}><span style={{width:8,height:8,borderRadius:2,background:C.tl,display:"inline-block"}}/><strong style={{color:C.tl}}>{pp}%</strong> proactive</span>
          <span style={{display:"flex",alignItems:"center",gap:4}}><span style={{width:8,height:8,borderRadius:2,background:rr>30?C.co:C.am,display:"inline-block"}}/><strong style={{color:rr>30?C.co:C.am}}>{rr}%</strong> reactive</span>
        </div>
        {guidedMode&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(240px,1fr))",gap:12}}>
          <GuideBox title="Reactive is a design outcome" tone="success">Reactive work should not be treated as a permanent tax. In many teams it is a symptom of weak or inconsistent design: customers do not know what comes next, internal expectations are fuzzy, and important questions surface at random. As service moments become clearer and more dependable, more of that work moves into planned interactions and capacity becomes easier to control.</GuideBox>
          <GuideBox title="Use workable hours, not flat monthly averages" tone="neutral">A flat 160-hour assumption hides useful information. Some months naturally have more workable time than others, which means they can absorb a little more demand or create room for improvement work. Modeling capacity month by month gives you a truer picture of when pressure is building and when you have breathing room.</GuideBox>
        </div>}
        <details style={{marginTop:12,border:"1px solid "+C.g2,borderRadius:10,background:C.wh}}>
          <summary style={{cursor:"pointer",padding:"12px 14px",fontSize:13,fontWeight:600,color:C.nv,listStyle:"none"}}>Advanced assumptions: workable hours by month</summary>
          <div style={{padding:"0 14px 14px"}}>
            <div style={{fontSize:12,color:C.tm,marginBottom:10}}>Keep the default month-by-month hours unless you have a better internal calendar. This is an advanced setting that helps the model reflect holidays and uneven working months.</div>
            <NG label="Workable Hrs / Month" values={wh} onChange={sWh}/>
          </div>
        </details>
        </div>}
      </div>

      <div style={{...sCd,border:"1px solid "+C.g2}}>

          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{width:6,height:6,borderRadius:"50%",background:financialOpen?C.od:C.g2,transition:"background .2s",flexShrink:0}}/>
              <div>
                <div style={{fontSize:11,fontWeight:700,color:C.od,letterSpacing:".08em",textTransform:"uppercase",marginBottom:2}}>Financial Assumptions</div>
                <h3 style={{fontSize:16,fontWeight:700,color:C.nv}}>Cost & Revenue Inputs</h3>
              </div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:11,color:C.tm}}>{financialOpen?"Collapse":"Expand"}</span>
              <div style={{flexShrink:0,width:26,height:26,borderRadius:999,background:financialOpen?C.ol:C.g1,color:financialOpen?C.nd:C.tm,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:700,transform:financialOpen?"rotate(180deg)":"rotate(0deg)",transition:"all .2s ease"}}>⌃</div>
            </div>
          </div>
          {!financialOpen&&<p style={{fontSize:12,color:C.tm,marginTop:6,marginLeft:16}}>These do not change the capacity math, but they translate headcount decisions into labor cost and supported revenue.</p>}
        </button>
        {financialOpen&&<div style={{marginTop:16}}>
          <p style={{fontSize:13,color:C.tm,marginBottom:16,lineHeight:1.6}}>These do not change the planning flow above, but they frame the output in business terms. Collapse this section when you want the planner to stay focused on operational inputs.</p>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12}}>

    </div>

    {/* TALKING POINTS */}
    <div style={sSec}>
      <div style={{...sTag,background:C.op,color:C.od}}>Executive Talking Points</div>
      <h2 style={sTitle}>Executive Talking Points</h2>
      <p style={sSub}>Use this section to translate the model into a leadership conversation. The goal is not to restate the math. It is to make the operating problem, the business risk, and the recommended action easy to understand.</p>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:12,marginBottom:12}}>
        <div style={sCd}>
          <div style={{fontSize:11,fontWeight:700,color:C.od,letterSpacing:".08em",textTransform:"uppercase",marginBottom:6}}>What to say first</div>
          <div style={{fontSize:13,color:C.g7,lineHeight:1.6}}>
            Start with the constraint in plain language: where capacity breaks, what is driving it, and what decision needs to be made. Keep the opening statement short enough that an executive can understand it in one pass.
          </div>
        </div>
        <div style={sCd}>
          <div style={{fontSize:11,fontWeight:700,color:C.od,letterSpacing:".08em",textTransform:"uppercase",marginBottom:6}}>How to frame the ask</div>
          <div style={{fontSize:13,color:C.g7,lineHeight:1.6}}>
            Frame the recommendation as a tradeoff, not a complaint. Explain the cost of waiting, the operational impact on customers and the team, and the best alternative lever if leadership wants to avoid an immediate hire.
          </div>
        </div>
      </div>

      <div style={sCd}>
        <div style={{fontSize:11,fontWeight:700,color:C.od,letterSpacing:".08em",textTransform:"uppercase",marginBottom:10}}>Suggested narrative</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(240px,1fr))",gap:10,marginBottom:12}}>
          <div style={{padding:"12px 14px",borderRadius:10,background:C.g1,border:"1px solid "+C.g2}}>
            <div style={{fontSize:11,fontWeight:700,color:C.od,letterSpacing:".08em",textTransform:"uppercase",marginBottom:6}}>What is happening</div>
            <div style={{fontSize:13,color:C.g7,lineHeight:1.55}}>
              {M.fr>=0?`Capacity moves beyond a sustainable level in ${MO[M.fr]}, with peak utilization reaching ${fp(M.pk)} in ${MO[M.pm]}.`:`Current staffing supports the modeled plan, but the margin for error is still visible in the utilization trend.`}
            </div>
          </div>

          <div style={{padding:"12px 14px",borderRadius:10,background:C.g1,border:"1px solid "+C.g2}}>
            <div style={{fontSize:11,fontWeight:700,color:C.od,letterSpacing:".08em",textTransform:"uppercase",marginBottom:6}}>Why it is happening</div>
            <div style={{fontSize:13,color:C.g7,lineHeight:1.55}}>
              {`The primary driver is ${M.pc}, which means the current service design and growth pattern are creating more demand than the team can absorb with its effective capacity.`}
            </div>
          </div>

          <div style={{padding:"12px 14px",borderRadius:10,background:C.g1,border:"1px solid "+C.g2}}>
            <div style={{fontSize:11,fontWeight:700,color:C.od,letterSpacing:".08em",textTransform:"uppercase",marginBottom:6}}>What we should do</div>
            <div style={{fontSize:13,color:C.g7,lineHeight:1.55}}>
              {M.hn>0?`Plan to add ${M.hn} ${M.hn>1?"resources":"resource"} by ${M.hm>=0?MO[M.hm]:"now"} so the team can absorb demand before service quality, onboarding speed, or consistency begins to degrade.`:`Use the current planning window to validate service moments, reduce reactive drag, and improve the design before growth accelerates again.`}
            </div>
          </div>

          <div style={{padding:"12px 14px",borderRadius:10,background:C.g1,border:"1px solid "+C.g2}}>
            <div style={{fontSize:11,fontWeight:700,color:C.od,letterSpacing:".08em",textTransform:"uppercase",marginBottom:6}}>If we do nothing</div>
            <div style={{fontSize:13,color:C.g7,lineHeight:1.55}}>
              {M.fr>=0?`The likely outcome is more heroic effort, slower execution of designed service moments, and greater risk to customer experience during the months under pressure.`:`The risk is lower right now, but failing to refine the model leaves the team exposed if actual growth lands above forecast.`}
            </div>
          </div>
        </div>

        <div style={{fontSize:11,fontWeight:700,color:C.od,letterSpacing:".08em",textTransform:"uppercase",marginBottom:8}}>Supporting points from the model</div>
        {talks.map((pt,i)=><div key={i} style={{display:"flex",gap:12,marginBottom:12,alignItems:"flex-start"}}>
          <div style={{width:24,height:24,borderRadius:6,background:C.nv,color:C.ol,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,flexShrink:0}}>{i+1}</div>
          <p style={{fontSize:13,color:C.g7,lineHeight:1.6}}>{pt}</p>
        </div>)}
      </div>
    </div>

    {/* CHARTS */}
    <div style={sSec}>
      <div style={{...sTag,background:C.op,color:C.od}}>Demand vs. Supply</div>
      <h2 style={sTitle}>Demand vs. Supply</h2>
      <p style={sSub}>This is where the model becomes visible. Demand reflects the work required to deliver the customer experience you designed, while supply reflects the capacity your team can realistically contribute after availability, reactivity, and ramp are taken into account.</p>
      <div style={{...sCd,padding:16}}>
        <div style={{fontSize:12,fontWeight:600,color:C.nv,marginBottom:12}}>Demand vs. Effective Supply (hours)</div>
        <LineChart data={cd} lines={[{key:"supply",name:"Effective Supply",color:C.tl,area:C.tp,width:2},{key:"demand",name:"Total Demand",color:C.co,width:2.5}]} height={260}/>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <div style={sCd}>
          <div style={{fontSize:12,fontWeight:600,color:C.nv,marginBottom:12}}>Utilization %</div>
          <BarChart data={cd} bars={[{key:"utilization",name:"Utilization",fill:d=>d.utilization>=100?C.rd:d.utilization>=90?C.or:C.tl}]} yMax={150} refLines={[{y:100,color:C.rd},{y:90,color:C.or}]}/>
        </div>
        <div style={sCd}>
          <div style={{fontSize:12,fontWeight:600,color:C.nv,marginBottom:12}}>OB vs CSM Demand</div>
          <StackedBarChart data={cd} bars={[{key:"obDemand",name:"Onboarding",fill:C.pu},{key:"csmDemand",name:"CSM",fill:C.bl}]}/>
        </div>
      </div>
    </div>

    {/* FINANCIAL */}
    <div style={sSec}>
      <div style={{...sTag,background:C.op,color:C.od}}>Cost + Revenue Context</div>
      <h2 style={sTitle}>Cost & Revenue Context</h2>
      <p style={sSub}>Capacity is not just an operational problem. It is a financial decision, which means the model should help translate team design into labor cost, supported revenue, and the cost of waiting too long to act.</p>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:12}}>
        {[{l:"Fully Loaded / Resource",v:fu(M.fl),c:C.nv},{l:"Team Cost (annual)",v:fu(M.tc),c:C.nv},{l:"Add'l Hire Cost",v:M.hn>0?fu(M.ah):"—",c:M.hn>0?C.co:C.g5},{l:"Supported Revenue",v:fu(M.sr),c:C.tl},{l:"Revenue / Team Member",v:M.ts>0?fu(Math.round(M.sr/M.ts)):"—",c:C.nv},{l:"Reactive Hrs/Yr",v:fmt(sum(M.rH))+"h",c:C.am}].map((c,i)=><div key={i} style={{borderRadius:10,padding:"16px 20px",textAlign:"center",background:C.wh,border:"1px solid "+C.g2}}><div style={{fontSize:20,fontWeight:700,color:c.c}}>{c.v}</div><div style={{fontSize:11,fontWeight:500,marginTop:4,color:C.tm}}>{c.l}</div></div>)}
      </div>
    </div>

    {/* REFINE */}
    <div style={sSec}>
      <div style={{...sTag,background:C.op,color:C.od}}>How to Make the Plan Better</div>
      <h2 style={sTitle}>How to make the plan better</h2>
      <p style={sSub}>The first draft is the start. The next job is to validate, refine, and maintain it.</p>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:12}}>
        {[
          {t:"Validate service moments",d:"Track whether key moments are actually being delivered and hold the team accountable to the design."},
          {t:"Identify bottlenecks",d:"Look for discomfort, bad time estimates, handoff friction, and distractions that block downstream moments."},
          {t:"Reduce excess effort",d:"Cut over-preparation, duplicate roles, or inconsistent execution that customers do not value."},
          {t:"Explore automation",d:"Use templates, checklists, and system support to reduce manual effort and free up direct capacity."},
          {t:"Maintain with actuals",d:"Refresh growth, customer data, and employee start dates so the plan stays useful in leadership meetings."}
        ].map((x,i)=><div key={i} style={sCd}><div style={{fontSize:13,fontWeight:700,color:C.nv,marginBottom:6}}>{x.t}</div><div style={{fontSize:12,color:C.tm,lineHeight:1.6}}>{x.d}</div></div>)}
      </div>
    </div>

    {/* METHODOLOGY */}
    <div style={sSec}>
      <div style={{...sTag,background:C.op,color:C.od}}>How This Works</div>
      <h2 style={sTitle}>How This Works</h2>
      <p style={sSub}>This section explains the logic behind the planner so the numbers feel interpretable, not magical. The model is directional and strategic on purpose: it should help you make better decisions, not pretend it can forecast every variable perfectly.</p>
      <div style={sCd}>
        <Ac title="Journey → Numbers" o={true}><p style={{fontSize:12,color:C.tm,lineHeight:1.7}}><strong>Journey</strong> → Inflection points.<br/><strong>Blueprint</strong> → Planned interactions.<br/><strong>Service Moments</strong> → Prep + execution + follow-through.<br/><strong>Capacity</strong> → Availability − demand, adjusted for ramp & reactive.</p></Ac>
        <Ac title="Key Assumptions"><p style={{fontSize:12,color:C.tm,lineHeight:1.7}}>• Target Availability ≠ 100% — ~35% indirect/unplanned.<br/>• Planning model, not precision forecast.<br/>• All assumptions editable.<br/>• Outputs depend on effort accuracy.<br/>• Reactive load & ramp compound.</p></Ac>
        <Ac title="What makes the plan easier to build"><p style={{fontSize:12,color:C.tm,lineHeight:1.7}}>Start from the current state, not the ideal state. Inventory the team’s actual service moments, ignore outliers when estimating, place work across months based on the journey, and remember that good design should reduce reactive load over time.</p></Ac>
        <Ac title="Spreadsheet Logic"><p style={{fontSize:12,color:C.tm,lineHeight:1.7}}>Growth cohorts cascade month-by-month. OB & CSM separate. Existing use Y2+ patterns. Each member: hours × availability × proactive % × ramp. Utilization = demand ÷ effective supply.</p></Ac>
      </div>
    </div>

    {/* DETAIL TABLE */}
    <div style={sSec}>
      <details style={{...sCd,padding:0,overflow:"hidden"}}>
        <summary style={{listStyle:"none",cursor:"pointer",padding:"18px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",userSelect:"none",background:C.wh}}>
          <div>
            <div style={{...sTag,background:C.op,color:C.od,marginBottom:6}}>Supporting Detail</div>
            <div style={{fontSize:20,fontWeight:700,color:C.nv,lineHeight:1.25}}>Month-by-Month Detail</div>
            <div style={{fontSize:13,color:C.tm,marginTop:4}}>Demand, supply, utilization, headroom, and risk by month.</div>
          </div>
          <div style={{fontSize:12,fontWeight:700,color:C.nv,whiteSpace:"nowrap"}}>Expand table ▾</div>
        </summary>
        <div style={{padding:"0 20px 20px"}}>
          <div style={{height:1,background:C.g2,marginBottom:16}}/>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
              <thead><tr><th style={sTh}>Mo</th><th style={{...sTh,textAlign:"right"}}>OB Dem</th><th style={{...sTh,textAlign:"right"}}>OB Sup</th><th style={{...sTh,textAlign:"right"}}>CSM Dem</th><th style={{...sTh,textAlign:"right"}}>CSM Sup</th><th style={{...sTh,textAlign:"right"}}>Demand</th><th style={{...sTh,textAlign:"right"}}>Supply</th><th style={{...sTh,textAlign:"right"}}>{M.gap>0?"Shortfall / Headroom":"Headroom / Shortfall"}</th><th style={{...sTh,textAlign:"right"}}>Reactive</th><th style={{...sTh,textAlign:"right"}}>Util</th><th style={{...sTh,textAlign:"center"}}>Status</th></tr></thead>
              <tbody>{cd.map((r,i)=><tr key={i} style={{background:M.rs[i]==="red"?"#FFEBEE":M.rs[i]==="orange"?"#FFF8E1":"transparent"}}><td style={{...sTd,fontWeight:600}}>{r.label}</td><td style={sTn}>{fmt(r.obDemand)}</td><td style={sTn}>{fmt(r.obSupply)}</td><td style={sTn}>{fmt(r.csmDemand)}</td><td style={sTn}>{fmt(r.csmSupply)}</td><td style={{...sTn,fontWeight:600}}>{fmt(r.demand)}</td><td style={sTn}>{fmt(r.supply)}</td><td style={{...sTn,color:r.headroom<0?C.rd:C.tl}}>{r.headroom<0?fmt(Math.abs(r.headroom))+"h short":fmt(r.headroom)+"h headroom"}</td><td style={sTn}>{fmt(r.reactiveHrs)}</td><td style={{...sTn,fontWeight:600,color:r.utilization>=100?C.rd:r.utilization>=90?C.or:C.tl}}>{r.utilization}%</td><td style={{...sTd,textAlign:"center"}}><Bd s={M.rs[i]}/></td></tr>)}</tbody>
              <tfoot><tr style={{fontWeight:700,borderTop:"2px solid "+C.nv}}><td style={sTd}>Total</td><td style={sTn}>{fmt(sum(M.oD))}</td><td style={sTn}>{fmt(sum(M.oES))}</td><td style={sTn}>{fmt(sum(M.cD))}</td><td style={sTn}>{fmt(sum(M.cES))}</td><td style={sTn}>{fmt(sum(M.tD))}</td><td style={sTn}>{fmt(sum(M.eS))}</td><td style={{...sTn,color:M.gap>0?C.rd:C.tl}}>{M.gap>0?fmt(M.gap)+"h short":fmt(Math.abs(M.gap))+"h headroom"}</td><td style={sTn}>{fmt(sum(M.rH))}</td><td style={sTn}>{sum(M.eS)>0?fp(sum(M.tD)/sum(M.eS)):"-"}</td><td style={sTd}/></tr></tfoot>
            </table>
          </div>
          <div style={{display:"flex",gap:12,marginTop:10,fontSize:11,color:C.tm,flexWrap:"wrap"}}><span>🟢 {M.gc} OK</span><span>🟠 {M.oc} warning</span><span>🔴 {M.rc} over</span><span>Use this table as supporting evidence after you’ve framed the decision.</span></div>
        </div>
      </details>
    </div>

    <div style={{...sSec,display:"none"}} className="print-only"><div style={{border:"1px solid "+C.g2,borderRadius:12,padding:20,background:C.wh}}><div style={{fontSize:18,fontWeight:700,color:C.nv,marginBottom:8}}>Print Summary</div><div style={{fontSize:13,color:C.g7,marginBottom:8}}>{actionNow}</div><div style={{fontSize:12,color:C.tm,marginBottom:10}}>Primary driver: {M.pc}. First month over capacity: {M.fr>=0?MO[M.fr]:"None"}.</div><div style={{fontSize:12,color:C.g7,lineHeight:1.6}}>Assumptions: {ta}% target availability, {pp}% proactive designed work, {rr}% reactive work, ramp = {rp.join(" / ")}.</div><div style={{marginTop:12}}>{talks.slice(0,3).map((t,i)=><div key={i} style={{fontSize:12,color:C.g7,marginBottom:6}}>• {t}</div>)}</div></div></div>
    <footer style={{background:C.nd,padding:24,borderTop:"1px solid rgba(197,212,78,.1)",textAlign:"center"}}>
      <p style={{fontSize:12,color:"rgba(255,255,255,.25)"}}><span style={{color:C.ol}}>CS Capacity Planning: The Guide</span> © 2022–2026 by CXology™ · Illustrative, not operational projections.</p>
        <div style={{textAlign:"center",paddingTop:"1rem"}}><div className="footer-copy">© 2022–2026 CXology LLC. All rights reserved.</div></div>
</footer>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
