<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk Test Results</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="desk.css">
<style>
  .wrap { max-width: 980px; padding-top: 32px; padding-bottom: 80px; }
  h1 { font-weight: 900; font-size: 32px; }
  .stats { display: flex; flex-wrap: wrap; gap: 12px; margin: 16px 0 24px; }
  .stat { background: #fff; border-radius: 10px; padding: 12px 16px; min-width: 130px; box-shadow: 0 2px 10px rgba(26,46,66,.06); }
  .stat b { display: block; font-size: 24px; font-weight: 900; }
  .stat span { font-size: 13px; color: var(--muted); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .filters button { background: #fff; color: var(--navy); border: 1px solid var(--gray-200); padding: 6px 12px; font-weight: 400; font-size: 14px; }
  .filters button.on { background: var(--navy); color: #fff; }
  details { background: #fff; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 10px rgba(26,46,66,.06); }
  summary { cursor: pointer; padding: 14px 18px; display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: baseline; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  summary .id { font-weight: 900; color: var(--muted); }
  summary .area { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); display: block; }
  summary .qq { font-weight: 400; }
  .tags { display: flex; gap: 6px; font-size: 12px; white-space: nowrap; }
  .tag2 { border-radius: 4px; padding: 2px 7px; background: var(--olive-pale); font-weight: 700; }
  .tag2.bad { background: #F6D9CF; color: #8a2f12; }
  details .card { box-shadow: none; border-radius: 0 0 10px 10px; }
  .notes { padding: 0 18px 16px; }
  .notes textarea { width: 100%; min-height: 60px; font: inherit; font-size: 14px; border: 1px solid var(--gray-200); border-radius: 6px; padding: 8px; }
  .verdict { display: flex; gap: 6px; margin: 8px 0; }
  .verdict button { background: #fff; color: var(--navy); border: 1px solid var(--gray-200); padding: 4px 12px; font-size: 13px; }
  .verdict button.on { background: var(--navy); color: #fff; }
  @media (max-width: 600px) { summary { grid-template-columns: 28px 1fr; } .tags { grid-column: 2; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Desk test results</h1>
  <p style="color:var(--muted);margin-top:6px">Real answers from testing the CXology Desk prototype, including edge cases: vague prompts and questions the book doesn't cover. Click any row to read the answer.</p>
  <div class="stats" id="stats"></div>
  <div class="filters" id="filters"></div>
  <div id="list"></div>
</div>
<script src="render.js"></script>
<script>
  // Tim's review verdicts and notes are kept in this browser only.
  const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
                  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
  const review = store.get("desk-review") || {};
  let filter = "all", results = [];
  // Review controls are Tim's; the public preview shows answers only.
  const PUBLIC = location.hostname !== "localhost" || location.search.includes("demo");

  const flags = (r) => {
    const f = [];
    if (r.error) f.push("error");
    if (r.blocked) f.push("blocked");
    if (r.expect !== "decline" && r.kind && r.kind !== (r.expect === "clarify" ? "clarify" : "play")) f.push("unexpected");
    return f;
  };

  function draw() {
    const total = results.reduce((n, r) => n + (r.cost || 0), 0);
    const plays = results.filter((r) => r.kind === "play" && !r.blocked);
    const avgCites = plays.length ? plays.reduce((n, r) => n + r.sources.length, 0) / plays.length : 0;
    const reviewed = results.filter((r) => review[r.id]?.verdict).length;
    document.getElementById("stats").innerHTML = [
      [results.length, "situations run"], [plays.length, "play cards"], [results.filter((r) => r.kind === "clarify").length, "asked to clarify"],
      [results.filter((r) => r.blocked).length, "blocked (no citations)"], [avgCites.toFixed(1), "avg citations per play"],
      ["$" + total.toFixed(2), "total cost"], ["$" + (results.length ? total / results.length : 0).toFixed(3), "avg per question"],
    ].concat(PUBLIC ? [] : [[`${reviewed}/${results.length}`, "reviewed by you"]]).map(([b, s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");

    const opts = [["all", "All"], ["flagged", "Flagged"]].concat(PUBLIC ? [] : [["unreviewed", "Not reviewed"], ["bad", "Marked wrong"]]);
    document.getElementById("filters").innerHTML = opts.map(([k, l]) => `<button data-f="${k}" class="${filter === k ? "on" : ""}">${l}</button>`).join("");
    document.querySelectorAll("#filters button").forEach((b) => b.onclick = () => { filter = b.dataset.f; draw(); });

    const shown = results.filter((r) => filter === "all" || (filter === "flagged" && flags(r).length) ||
      (filter === "unreviewed" && !review[r.id]?.verdict) || (filter === "bad" && review[r.id]?.verdict === "wrong"));
    const list = document.getElementById("list"); list.innerHTML = "";
    for (const r of shown) {
      const d = document.createElement("details");
      const tags = [r.kind || "error", `${r.sources?.length || 0} cites`, r.cost != null ? "$" + r.cost.toFixed(3) : ""].filter(Boolean)
        .map((t) => `<span class="tag2">${esc(t)}</span>`).concat(flags(r).map((f) => `<span class="tag2 bad">${f}</span>`)).join("");
      d.innerHTML = `<summary><span class="id">${r.id}</span><span><span class="area">${esc(r.area)} · expected ${r.expect}</span><span class="qq">${esc(r.q)}</span></span><span class="tags">${tags}</span></summary>`;
      d.appendChild(render(r, "r" + r.id));
      const v = review[r.id] || {};
      const notes = document.createElement("div"); notes.className = "notes";
      notes.innerHTML = `<div class="verdict">${["good", "needs work", "wrong"].map((x) => `<button class="${v.verdict === x ? "on" : ""}">${x}</button>`).join("")}</div><textarea placeholder="Notes on this answer...">${esc(v.note || "")}</textarea>`;
      notes.querySelectorAll("button").forEach((b) => b.onclick = () => { review[r.id] = { ...review[r.id], verdict: b.textContent }; store.set("desk-review", review); draw(); });
      notes.querySelector("textarea").oninput = (e) => { review[r.id] = { ...review[r.id], note: e.target.value }; store.set("desk-review", review); };
      if (!PUBLIC) d.appendChild(notes);
      list.appendChild(d);
    }
  }

  fetch("test-results.json").then((r) => r.ok ? r.json() : []).then((data) => { results = data; draw(); })
    .catch(() => { document.getElementById("list").textContent = "No results yet. Run: node run-tests.mjs"; });
</script>
<p style="text-align:center;font-size:13px;margin:0 0 32px"><a href="index.html" style="color:#5A6A40">CXology Desk preview home</a></p>
</body>
</html>
