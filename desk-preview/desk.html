<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CXology Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="desk.css">
</head>
<body>
<div class="wrap">
  <section class="home">
    <div class="brand-row"><div class="brand">CXology<span>Desk</span></div><button class="new-q" type="button" id="new-q">New question</button></div>
    <p class="tag">Bring a customer situation. Get the play, grounded in <em>The Post-Sale Operating System</em>.</p>
    <form id="ask">
      <textarea id="input" rows="1" placeholder="Our champion just left and renewal is in 90 days..." autofocus></textarea>
      <button id="go">Ask</button>
    </form>
    <div class="chips">
      <button class="chip">Our champion left and renewal is in 90 days</button>
      <button class="chip">Customer signed 4 months ago and still hasn't seen value</button>
      <button class="chip">How many accounts should each CSM carry?</button>
      <button class="chip">Leadership wants a renewal forecast we can trust</button>
    </div>
  </section>
  <section class="thread" id="thread"></section>
</div>
<script src="render.js"></script>
<script>
  const thread = document.getElementById("thread");
  const input = document.getElementById("input");
  const go = document.getElementById("go");
  let history = [];

  // Demo mode: anywhere but the local server, play back real answers recorded in testing (no API calls).
  const DEMO = location.hostname !== "localhost" || location.search.includes("demo");
  let samples = [];
  if (DEMO) {
    document.querySelector(".tag").insertAdjacentHTML("afterend",
      `<p class="tag" style="font-size:14px;margin-top:-18px">Preview: this plays back real answers from testing. Pick a sample situation below.</p>`);
    fetch("test-results.json").then((r) => r.json()).then((data) => {
      samples = data.filter((r) => r.text);
      const picks = [1, 2, 3, 45, 52].map((id) => samples.find((s) => s.id === id)).filter(Boolean);
      document.querySelector(".chips").innerHTML = picks.map((s) => `<button class="chip">${esc(s.q)}</button>`).join("");
      document.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => submit(c.textContent)));
    });
  }

  function demoAnswer(text) {
    const s = samples.find((x) => x.q === text);
    if (s) return { result: s, seconds: s.seconds || 30 };
    return { picker: true };
  }

  function showPicker() {
    const card = document.createElement("div"); card.className = "card clarify";
    card.innerHTML = `<p>This preview can't answer new questions yet. It plays back answers the Desk gave in testing. Try one of these:</p>` +
      samples.map((s) => `<p><button class="chip" style="text-align:left">${esc(s.q)}</button></p>`).join("");
    card.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => submit(c.textContent)));
    thread.appendChild(card);
  }

  // FND-005: short prompts on small screens so the placeholder is never cut off.
  const SMALL = matchMedia("(max-width: 560px)").matches;
  const PROMPT = SMALL ? "Describe a situation..." : "Our champion just left and renewal is in 90 days...";
  const FOLLOW = SMALL ? "Ask a follow-up..." : "Ask a follow-up, or describe another situation...";
  input.placeholder = PROMPT;

  const waiting = () => {
    const el = document.createElement("div"); el.className = "loading";
    el.innerHTML = "<b>Reading the book</b><small>Usually about 30 seconds</small>";
    return el;
  };
  const addQuestion = (text) => {
    const q = document.createElement("div"); q.className = "q"; q.textContent = text; thread.appendChild(q);
  };

  let busy = false; // one request at a time
  async function submit(text) {
    text = text.trim();
    if (!text || busy) return;
    if (DEMO) {
      document.body.classList.add("asked");
      addQuestion(text);
      input.value = "";
      const d = demoAnswer(text);
      if (d.picker) { showPicker(); return; }
      busy = true;
      const loading = waiting();
      thread.appendChild(loading); loading.scrollIntoView({ behavior: "smooth" });
      await new Promise((r) => setTimeout(r, 1200));
      loading.remove();
      const card = render(d.result, "a" + thread.children.length);
      thread.appendChild(card);
      const meta = document.createElement("div"); meta.className = "meta";
      meta.textContent = (d.result.handRun ? `Example written to the Desk's rules · ${d.result.sources.length} citations, each verified word for word against the book`
        : `Recorded answer · took ${d.seconds}s live · ${d.result.sources.length} citations`) +
        (d.result.kind === "clarify" ? " · in the live Desk you would answer these questions next" : "");
      thread.appendChild(meta);
      card.scrollIntoView({ behavior: "smooth", block: "start" });
      input.placeholder = FOLLOW;
      busy = false;
      return;
    }
    busy = true; go.disabled = true;
    document.body.classList.add("asked");
    history.push({ role: "user", text });
    addQuestion(text);
    const loading = waiting();
    thread.appendChild(loading); loading.scrollIntoView({ behavior: "smooth" });
    input.value = "";
    const t0 = Date.now();
    let result;
    try {
      const r = await fetch("/api/ask", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ history }) });
      result = await r.json().catch(() => ({ error: { kind: "failed", message: "Something went wrong on our side. Try again in a moment." } }));
    } catch {
      result = { error: { kind: "offline", message: "You seem to be offline. Check your connection and try again." } };
    }
    loading.remove();
    const card = render(result, "a" + history.length);
    thread.appendChild(card);
    if (result.error) {
      // Keep the reader's question: put it back in the box and offer a retry.
      history.pop();
      input.value = text;
      input.dispatchEvent(new Event("input"));
      card.querySelector(".retry")?.addEventListener("click", () => { card.previousElementSibling?.remove(); card.remove(); submit(input.value); });
    } else {
      const meta = document.createElement("div"); meta.className = "meta";
      meta.textContent = `${((Date.now() - t0) / 1000).toFixed(0)}s · ${result.sources?.length || 0} citations`;
      thread.appendChild(meta);
      history.push({ role: "assistant", text: result.text.replace(/\[\[\w+\]\]/g, "") });
      input.placeholder = result.kind === "clarify" ? "Answer here..." : FOLLOW;
      card.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    busy = false; go.disabled = false; input.focus();
  }

  document.getElementById("new-q").addEventListener("click", () => {
    thread.innerHTML = ""; history = []; input.value = ""; input.placeholder = PROMPT;
    document.body.classList.remove("asked");
    window.scrollTo({ top: 0 }); input.focus();
  });
  document.getElementById("ask").addEventListener("submit", (e) => { e.preventDefault(); submit(input.value); });
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(input.value); } });
  input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; });
  document.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => submit(c.textContent)));
</script>
<p style="text-align:center;font-size:13px;margin:0 0 32px"><a href="index.html" style="color:#5A6A40">CXology Desk preview home</a></p>
</body>
</html>
